[hyperparameters]
# lr = 1e-3
# reg = 1e-6
# embed_size = 64
# n_layers = 2
# batch_size = 4096
epoch = 500
;adj_type = plain, norm, gcmc, pre
adj_type = pre
num_neg = 10
is_pairwise = False
loss_func = sigmoid_cross_entropy
param_init = xavier_uniform

# Model Arguments
n_hid = 64
n_layers =3
s_layers = 2
weight=True

# Train Arguments
dropout = 0.2

# Optimization Arguments
lr = 1e-3
difflr = 1e-3
reg =2e-6
decay = 0.985
decay_step = 1
# n_epoch = 150
batch_size = 4096
patience = 20

# params for the denoiser
time_type='cat'
dims=64
emb_size=64
norm=True

# params for diffusions
# steps=20
steps=30
noise_schedule='linear-var'
noise_scale=1
noise_min=0.0001
noise_max=0.1
sampling_noise=False
sampling_steps=0
reweight=True




